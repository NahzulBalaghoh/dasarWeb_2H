<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../assets/css/style.css">
</head>

<body>
    <header class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" id="nav-toggle-btn" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title h4 mb-3 text-primary">Daftar Buku</h2>

                <div class="search-box">
                    <label for="search-input" class="form-label fw-semibold">Cari Judul Buku</label>
                    <input type="text" class="form-control" id="search-input" placeholder="Ketik judul buku...">
                </div>
                <p class="small text-secondary mb-2" id="table-count"></p>
                <p id="loading-indicator" style="display:none;">Memuat data...</p>
                <button type="button" class="btn btn-outline-primary btn-sm mb-2" id="btn-muat-ulang">Muat Ulang</button>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="bg-primary">
                            <tr class="text-white">
                                <th>Judul</th>
                                <th>Pengarang</th>
                                <th>Tahun</th>
                                <th>Kategori</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary small py-4">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
</html>
